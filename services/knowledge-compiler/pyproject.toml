[tool.poetry]
name = "knowledge-compiler"
version = "1.0.0"
description = "LLM Wiki pattern for codebases - compile once, maintain persistently, query efficiently"
authors = ["AHS 2026"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = "^0.32.0"
pydantic = "^2.10.0"
httpx = "^0.27.0"
python-dotenv = "^1.0.0"
gitpython = "^3.1.43"
networkx = "^3.4"
aiofiles = "^24.1.0"
markdown-it-py = "^3.0.0"
jinja2 = "^3.1.4"
openai = "^1.56.0"
aiohttp = "^3.11.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"